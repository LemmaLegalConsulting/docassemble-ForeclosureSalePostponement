name: ALKiln end-to-end interviews
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: Optional Cucumber tag expression
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: alkiln-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  interviews:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Make room for docassemble
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - name: Start an isolated temporary docassemble server
        id: server
        uses: SuffolkLITLab/ALKiln/action_for_github_server@7b399f7138a06cb411cb93bda4d2015cea9216c5 # v5
        with:
          CONFIG_CONTENTS: |
            debug: true
            preloaded modules:
              - docassemble.ALToolbox.ThreePartsDate
          DOCASSEMBLE_IMAGE: jhpyle/docassemble:1.10.7@sha256:c0b0a707a6cd2149d5777ee83af1ea1de544210e597371eac93e67a1503c395c
      - name: Restart web workers after installing datatype dependencies
        env:
          SERVER_URL: ${{ steps.server.outputs.SERVER_URL }}
        run: |
          docker exec docassemble_container supervisorctl restart uwsgi
          alkiln_ready_deadline=$((SECONDS + 180))
          while (( SECONDS < alkiln_ready_deadline )); do
            if curl --fail --silent --show-error --max-time 5 "$SERVER_URL" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "The isolated server did not become ready after restarting uwsgi."
          exit 1
      - name: Install ALKiln and PDF assertion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm install --install-strategy=nested --prefix "$RUNNER_TEMP/alkiln" @suffolklitlab/alkiln@5.17.1
          echo "ALKILN_PATH=$RUNNER_TEMP/alkiln/node_modules/@suffolklitlab/alkiln" >> "$GITHUB_ENV"
      - name: Run all interview features with repository custom steps
        env:
          SERVER_URL: ${{ steps.server.outputs.SERVER_URL }}
          DOCASSEMBLE_DEVELOPER_API_KEY: ${{ steps.server.outputs.DOCASSEMBLE_DEVELOPER_API_KEY }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          ALKILN_TAG_EXPRESSION: ${{ inputs.tags }}
          TZ: America/New_York
          _ORIGIN: github
        run: python3 tests/run_alkiln_ci.py
      - name: Show disposable server error logs on failure
        if: failure()
        run: |
          container_id=$(docker ps -q | head -1)
          if [ -n "$container_id" ]; then
            docker exec "$container_id" tail -n 200 /usr/share/docassemble/log/docassemble.log || true
          fi
      - name: Upload browser reports and generated documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alkiln-results
          path: .alkiln-artifacts/ci
          include-hidden-files: true
          if-no-files-found: warn
