name: ALKiln end-to-end interviews
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: Optional Cucumber tag expression
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: alkiln-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  interviews:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Make room on the disposable GitHub runner
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - name: Build isolated server and run every interview feature
        env:
          ALKILN_TAG_EXPRESSION: ${{ inputs.tags }}
        run: python tests/run_docker_e2e.py
      - name: Upload browser reports and generated documents
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alkiln-results
          path: .alkiln-artifacts/ci
          include-hidden-files: true
          if-no-files-found: warn
