---
code: |
  AL_DEFAULT_COUNTRY = "US"
  AL_DEFAULT_STATE = "MN"
  al_form_type = "other_form"
  user_role = "na"
  signature_fields = []
---
template: interview_short_title
content: |
  Postpone a foreclosure sale
---
objects:
- owner: ALPeopleList.using(there_are_any=True, complete_attribute="complete")
- drafter: ALPeopleList.using(target_number=1)
- al_logo: DAStaticFile.using(filename="MNfavicon-96x96.png", alt_text="LawHelpMN")
---
mandatory: true
code: |
  al_intro_screen
  postponement_intro
  qualifies_homestead
  if not (qualifies_homestead and occupies_home and dwelling_limit and living_owner):
    postponement_help
  proceeding_recorded_date
  if proceeding_recorded_date < as_datetime("2026-04-22"):
    older_proceeding_help
  if previous_postponement:
    prior_postponement_help
  sale_date
  # Recompute on each review cycle, rather than caching dependent answers.
  filing_cutoff = sale_date.minus(days=15)
  deadline_notice
  if today() > filing_cutoff:
    deadline_help
  if not publication_started:
    publication_help
  if not accepts_shorter_redemption:
    redemption_help
  owner.gather()
  county
  drafter[0].name.first
  drafter[0].address.address
  foreclosure_sale_postponement_download
---
code: |
  owner[i].name.first
  owner[i].complete = True
---
id: postponement introduction
continue button field: postponement_intro
question: |
  Postpone a Minnesota foreclosure sale
subquestion: |
  This interview prepares an affidavit for an owner who lives in the home.
  You need your current sale notice and the recorded notice of pendency or lis pendens.

  **Postponing the sale reduces your time to redeem the property to five weeks.**
  Redemption means paying the required amount after the sale to keep the property.

  Talk with a [foreclosure counselor](https://www.hocmn.org/) before choosing this option.
  This interview does not file anything for you.

  Read [Your Rights in Foreclosure](https://www.lawhelpmn.org/self-help-library/fact-sheet/your-rights-foreclosure) on LawHelpMN for more information.
---
id: property and owner eligibility
question: |
  Tell us about the property
fields:
- Is the property classified as your homestead for property taxes?: qualifies_homestead
  datatype: yesnoradio
- Do you live in the property as your home?: occupies_home
  datatype: yesnoradio
- Does the property have one to four dwelling units?: dwelling_limit
  datatype: yesnoradio
- Are you a living owner or mortgagor of the property?: living_owner
  datatype: yesnoradio
  help: |
    Choose No if you are acting for a deceased owner or an estate.
---
id: unsupported property or representative
event: postponement_help
question: |
  Get help with your circumstances
subquestion: |
  This interview covers a living owner who occupies a qualifying homestead with one to four dwelling units.
  Your answers need individual review before using this affidavit.

  A representative or heir may have options even though this interview does not prepare that route.
  Contact a [foreclosure counselor](https://www.hocmn.org/) or find
  [legal help](https://www.lawhelpmn.org/providers-and-clinics).

  ${ action_button_html(url_action('qualifies_homestead'), label='Edit property answers') }
---
id: proceeding date
question: |
  When was the foreclosure notice recorded?
subquestion: |
  Use the recording date of the **notice of pendency** or **lis pendens**.
  This is different from the sale date or the first newspaper publication.

  The county recorder or the foreclosure attorney can help you find the recorded notice.
  The recording date determines which version of the law applies.
fields:
- Recording date: proceeding_recorded_date
  datatype: date
  max: ${ today() }
---
id: older proceeding help
event: older_proceeding_help
question: |
  Your proceeding needs an earlier form review
subquestion: |
  This interview uses the 2026 affidavit for proceedings whose notice was recorded on or after April 22, 2026.
  A proceeding recorded earlier needs review under the earlier rules.

  Contact a [foreclosure counselor](https://www.hocmn.org/) for help.
  ${ action_button_html(url_action('proceeding_recorded_date'), label='Edit recording date') }
---
id: prior owner postponement
question: |
  Have you already used an owner postponement?
subquestion: |
  Answer for this foreclosure proceeding. A postponement requested by the lender is different.
fields:
- Have you or another owner already used this affidavit to postpone this proceeding?: previous_postponement
  datatype: yesnoradio
---
id: prior postponement help
event: prior_postponement_help
question: |
  Get advice before requesting another postponement
subquestion: |
  An owner postponement can be used only once in a foreclosure proceeding.
  Contact a [foreclosure counselor](https://www.hocmn.org/) to review your options.

  ${ action_button_html(url_action('previous_postponement'), label='Edit postponement answer') }
---
id: current sale date
question: |
  When is the sale scheduled?
subquestion: |
  Use the date in the current Notice of Mortgage Foreclosure Sale or a later Postponement Notice.
  You will attach that notice to your affidavit.
fields:
- Scheduled sale date: sale_date
  datatype: date
---
id: filing cutoff notice
continue button field: deadline_notice
question: |
  Complete the filing steps by ${ filing_cutoff.format() }
subquestion: |
  This date is **15 calendar days before** the scheduled sale on ${ sale_date.format() }.
  Record the affidavit. File a recorded copy with the sheriff and deliver a recorded copy to the foreclosure attorney.

  Finish early. If offices are closed on this date, arrange to finish before they close.
  This interview does not add time for weekends or holidays.
---
id: deadline help
event: deadline_help
question: |
  Get help right away
subquestion: |
  The date 15 days before your scheduled sale has passed.
  Contact a [foreclosure counselor](https://www.hocmn.org/) or an attorney about your options.
  This interview cannot determine whether a late affidavit will be accepted.

  ${ action_button_html(url_action('sale_date'), label='Edit sale date') }
---
id: publication has started
question: |
  Has publication of the sale notice started?
subquestion: |
  The affidavit must be recorded after the first publication of the notice.
  For a rescheduled sale, check the current Postponement Notice with the foreclosure attorney.
fields:
- Has the notice been published?: publication_started
  datatype: yesnoradio
---
id: publication help
event: publication_help
question: |
  Check the publication before recording
subquestion: |
  Ask the foreclosure attorney or a [foreclosure counselor](https://www.hocmn.org/) to confirm when you can record the affidavit.
  ${ action_button_html(url_action('publication_started'), label='Edit publication answer') }
---
id: shorter redemption period
question: |
  Do you want to use this postponement?
subquestion: |
  If your original redemption period is six months, this option postpones the sale five months.
  If it is twelve months, this option postpones the sale eleven months.

  In exchange, your redemption period after the sale becomes **five weeks**.
  Ask a [foreclosure counselor](https://www.hocmn.org/) if you are unsure how this affects you.
fields:
- Do you want to shorten your redemption period to five weeks in exchange for postponement?: accepts_shorter_redemption
  datatype: yesnoradio
---
id: redemption help
event: redemption_help
question: |
  You have not chosen to shorten your redemption period
subquestion: |
  This interview will not prepare an affidavit making that choice for you.
  Contact a [foreclosure counselor](https://www.hocmn.org/) about other options.

  ${ action_button_html(url_action('accepts_shorter_redemption'), label='Edit your choice') }
---
id: property county
question: |
  Which county is the property in?
fields:
- County: county
  help: Enter the county name without the word County.
---
id: foreclosure review
event: review_foreclosure_sale_postponement
question: |
  Review your answers
review:
- Edit: qualifies_homestead
  button: |
    **Property and owner eligibility**
- Edit: proceeding_recorded_date
  button: |
    **Notice recorded:** ${ proceeding_recorded_date.format() }
- Edit: previous_postponement
  button: |
    **Previous owner postponement:** ${ yesno(previous_postponement) }
- Edit: sale_date
  button: |
    **Scheduled sale:** ${ sale_date.format() }
- Edit: publication_started
  button: |
    **Publication started:** ${ yesno(publication_started) }
- Edit: accepts_shorter_redemption
  button: |
    **Choose five-week redemption:** ${ yesno(accepts_shorter_redemption) }
- Edit: owner.revisit
  button: |
    **Owners:** ${ owner }
- Edit: county
  button: |
    **Property county:** ${ county }
- Edit: drafter[0].name.first
  button: |
    **Prepared by:** ${ drafter[0] }
- Edit: drafter[0].address.address
  button: |
    **Preparer address:** ${ drafter[0].address.on_one_line() }
---
id: review owners
continue button field: owner.revisit
question: |
  Edit the owners
subquestion: |
  ${ owner.table }
  ${ owner.add_action() }
---
table: owner.table
rows: owner
columns:
- Name: row_item.name.full()
edit:
- name.first
confirm: true
---
id: download foreclosure forms
event: foreclosure_sale_postponement_download
question: |
  Review and print your affidavit
subquestion: |
  Your affidavit and instructions are ready. Review them before signing in front of a notary.
  Attach the current sale notice. **Nothing has been filed.**

  The date 15 days before your sale is **${ filing_cutoff.format() }**.
  Finish recording and delivery before office closures or other delays.

  ${ action_button_html(url_action('review_foreclosure_sale_postponement'), label='Edit answers', color='info') }
  ${ al_user_bundle.download_list_html() }

  Learn more: [Your Rights in Foreclosure](https://www.lawhelpmn.org/self-help-library/fact-sheet/your-rights-foreclosure) on LawHelpMN.
progress: 100
