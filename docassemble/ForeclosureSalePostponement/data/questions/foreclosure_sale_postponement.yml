---
id: postponement introduction
continue button field: postponement_intro
question: |
  Postpone a Minnesota foreclosure sale
subquestion: |
  This interview prepares an affidavit to postpone the sale of a home you own and live in.
  You will sign it in front of a notary, then record and deliver it yourself.

  Have these papers ready:

  * Your current sale notice
  * The notice of pendency (also called a lis pendens)

  **If you postpone the sale, you will have only 5 weeks after the sale to redeem your home.**
  To redeem means to pay the full amount owed after the sale so you can keep your home.

  Talk with a [foreclosure counselor](https://www.hocmn.org/) first.

  Read [Your Rights in Foreclosure](https://www.lawhelpmn.org/self-help-library/fact-sheet/your-rights-foreclosure) on LawHelpMN for more information.
---
id: property and owner eligibility
question: |
  Tell us about the property
fields:
- Is the property your homestead for property taxes?: qualifies_homestead
  datatype: yesnoradio
  help: |
    Your property tax statement says if the property is a homestead.
- Do you live in the property?: occupies_home
  datatype: yesnoradio
- Does the property have 4 or fewer homes or apartments?: dwelling_limit
  datatype: yesnoradio
- Do you own the property or did you sign the mortgage?: living_owner
  datatype: yesnoradio
  help: |
    If you are acting for an owner who died or for an estate, choose No.
---
id: unsupported property or representative
event: postponement_help
question: |
  This interview cannot prepare your affidavit
subquestion: |
  This affidavit is only for an owner who lives in a homestead property with 4 or fewer homes.
  Your answers show:

  % if not qualifies_homestead:
  * The property is not your homestead for property taxes.
  % endif
  % if not occupies_home:
  * You do not live in the property.
  % endif
  % if not dwelling_limit:
  * The property has more than 4 homes or apartments.
  % endif
  % if not living_owner:
  * You are not an owner, or you are acting for an owner who died or for an estate.
  % endif

  You may still have options. Contact a [foreclosure counselor](https://www.hocmn.org/) or find
  [legal help](https://www.lawhelpmn.org/providers-and-clinics).

  ${ action_button_html(url_action('qualifies_homestead'), label='Edit property answers') }
---
id: proceeding date
question: |
  When was the notice of pendency recorded?
subquestion: |
  The county stamps a recording date on the **notice of pendency** (also called a **lis pendens**).
  This is not the sale date or the date the notice was in the newspaper.
fields:
- I do not know the recording date: recording_date_unknown
  datatype: yesno
- Recording date: proceeding_recorded_date
  datatype: date
  max: ${ today() }
  hide if: recording_date_unknown
---
id: recording date help
event: recording_date_help
question: |
  Find the recording date before you continue
subquestion: |
  The recording date tells us which version of the law and which affidavit apply to you.

  To find it:

  * Ask the foreclosure attorney named on your sale notice.
  * Call the county recorder's office where the property is.
  * Ask a [foreclosure counselor](https://www.hocmn.org/) for help.

  ${ action_button_html(url_action('recording_date_unknown'), label='Enter the recording date') }
---
id: older proceeding help
event: older_proceeding_help
question: |
  This interview cannot prepare an affidavit for an older foreclosure
subquestion: |
  Your notice of pendency was recorded on ${ proceeding_recorded_date.format() }.
  This interview only works if it was recorded on or after April 22, 2026.
  Earlier foreclosures use different rules.

  Contact a [foreclosure counselor](https://www.hocmn.org/) for help.

  ${ action_button_html(url_action('proceeding_recorded_date'), label='Edit recording date') }
---
id: prior owner postponement
question: |
  Has any owner already used this affidavit to postpone this foreclosure?
subquestion: |
  Count only postponements that an owner asked for. Do not count postponements the lender asked for.
fields:
- no label: previous_postponement
  datatype: yesnoradio
---
id: prior postponement help
event: prior_postponement_help
question: |
  You cannot use this affidavit again
subquestion: |
  Owners can use this affidavit only once in each foreclosure.
  A [foreclosure counselor](https://www.hocmn.org/) can tell you about other options.

  ${ action_button_html(url_action('previous_postponement'), label='Edit postponement answer') }
---
id: current sale date
question: |
  When is the sale?
subquestion: |
  Use the sale date on your Notice of Mortgage Foreclosure Sale. If you got a
  Postponement Notice later, use the date on that notice. You will attach this notice to your affidavit.
fields:
- Scheduled sale date: sale_date
  datatype: date
---
id: filing cutoff notice
continue button field: deadline_notice
question: |
  Plan to finish the filing steps by ${ filing_business_day.format() }
subquestion: |
  Your sale is on ${ sale_date.format() }. You must finish these steps at least
  **15 days before the sale**:

  1. Record the signed affidavit with the county.
  1. File a recorded copy with the sheriff.
  1. Give a recorded copy to the foreclosure attorney.

  The legal cutoff is **${ filing_cutoff.format() }**, 15 calendar days before the sale.
  % if filing_business_day != filing_cutoff:
  That date falls on a weekend or Minnesota holiday. Plan to finish by
  **${ filing_business_day.format() }**, the last business day before the cutoff.
  % endif
  Confirm office hours and finish earlier if any office will be closed.
  Weekends and holidays do not extend the legal cutoff.
---
id: deadline help
event: deadline_help
question: |
  Get help right away
subquestion: |
  Your sale is on ${ sale_date.format() }. The last day to finish the filing steps was ${ filing_cutoff.format() }.
  This interview cannot tell you if a late affidavit will work.

  Contact a [foreclosure counselor](https://www.hocmn.org/) or a lawyer now.

  ${ action_button_html(url_action('sale_date'), label='Edit sale date') }
---
id: publication has started
question: |
  Has the sale notice been in the newspaper yet?
subquestion: |
  You can record the affidavit only after the sale notice is first published in the newspaper.
  If your sale was rescheduled, ask the foreclosure attorney about the Postponement Notice.
fields:
- no label: publication_started
  datatype: yesnomaybe
---
id: publication help
event: publication_help
question: |
  Check that the notice was published
subquestion: |
  You can record the affidavit only after the sale notice is in the newspaper.
  Ask the foreclosure attorney or a [foreclosure counselor](https://www.hocmn.org/) when it was published.
  Then come back and change your answer.

  ${ action_button_html(url_action('publication_started'), label='Edit publication answer') }
---
id: shorter redemption period
question: |
  Do you want to postpone the sale and have a shorter time to redeem?
subquestion: |
  Your sale notice says how long your redemption period is.

  * If your redemption period is **6 months**, the sale is postponed **5 months**.
  * If your redemption period is **12 months**, the sale is postponed **11 months**.

  In exchange, you will have only **5 weeks** after the sale to redeem your home.
  If you are not sure how this affects you, ask a [foreclosure counselor](https://www.hocmn.org/).
fields:
- Postpone the sale and shorten my redemption period to 5 weeks: accepts_shorter_redemption
  datatype: yesnoradio
---
id: redemption help
event: redemption_help
question: |
  This interview cannot help without the shorter redemption period
subquestion: |
  This affidavit only works if you agree to a 5-week redemption period.
  You chose not to. A [foreclosure counselor](https://www.hocmn.org/) can tell you about other options.

  ${ action_button_html(url_action('accepts_shorter_redemption'), label='Edit your choice') }
---
id: property county
question: |
  Which county is the property in?
fields:
- County: county
  datatype: dropdown
  code: minnesota_counties
---
id: foreclosure review
event: review_foreclosure_sale_postponement
question: |
  Review your answers
review:
