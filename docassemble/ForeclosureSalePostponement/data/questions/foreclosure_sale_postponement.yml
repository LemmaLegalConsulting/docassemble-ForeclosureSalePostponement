    **Notice recorded:** ${ proceeding_recorded_date.format() }
- Edit: previous_postponement
  button: |
    **Owner already postponed this foreclosure:** ${ yesno(previous_postponement) }
- Edit: sale_date
  button: |
    **Scheduled sale:** ${ sale_date.format() }
- Edit: publication_started
  button: |
    **Sale notice published:** ${ yesno(publication_started) if publication_started is not None else "I do not know" }
- Edit: accepts_shorter_redemption
  button: |
    **Agreed to 5-week redemption:** ${ yesno(accepts_shorter_redemption) }
- Edit: owner.revisit
  button: |
    **Owners:** ${ owner }
- Edit: county
  button: |
    **Property county:** ${ county }
- Edit: drafter[0].name.first
  button: |
    **Prepared by:** ${ drafter[0] }
- Edit: drafter[0].address.address
  button: |
    **Preparer address:** ${ drafter[0].address.on_one_line() }
---
id: review owners
continue button field: owner.revisit
question: |
  Edit the owners
subquestion: |
  ${ owner.table }
  ${ owner.add_action() }
---
table: owner.table
rows: owner
columns:
- Name: row_item.name.full()
edit:
- name.first
confirm: true
---
id: download foreclosure forms
event: foreclosure_sale_postponement_download
question: |
  Review and print your affidavit
subquestion: |
  Your affidavit and instructions are ready. **You still need to sign, record, and deliver the affidavit.**

  1. Read every page.
  1. Sign the affidavit in front of a notary.
  1. Attach your current sale notice.
  1. Plan to finish recording and delivery by **${ filing_business_day.format() }**. Confirm office hours and allow time for delays.

  The legal cutoff is **${ filing_cutoff.format() }**, 15 calendar days before the sale.

  ${ action_button_html(url_action('review_foreclosure_sale_postponement'), label='Edit answers', color='info') }
  ${ al_user_bundle.download_list_html() }

  Learn more: [Your Rights in Foreclosure](https://www.lawhelpmn.org/self-help-library/fact-sheet/your-rights-foreclosure) on LawHelpMN.
progress: 100
